name: doc-discussion

# 通用「文档 → 讨论」发布器（用户 2026-11-28：设计讨论搬到 Discussion）
#
# 为什么需要它：Issue 评论只有一层平铺，不能楼中楼；Discussion 可以逐条回复。
# 但 GitHub 的 Discussion 创建只有 GraphQL createDiscussion，MCP 没有对应工具，
# 所以按 AGENTS §8.4 的既有约定：正文先落成仓库文件，再由 bot 工作流发布。
#
# 同名讨论已存在时：追加一条评论（不覆盖历史），所以反复 dispatch 是安全的。

on:
  workflow_dispatch:
    inputs:
      file:
        description: '正文来源文件（仓库内相对路径）'
        required: true
      title:
        description: '讨论标题；已存在同名讨论时追加评论'
        required: true
      category:
        description: '讨论分类名（General / Ideas / Q&A …）'
        required: false
        default: 'General'

permissions:
  contents: read
  discussions: write

concurrency:
  group: doc-discussion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOC_FILE: ${{ inputs.file }}
      DOC_TITLE: ${{ inputs.title }}
      DOC_CATEGORY: ${{ inputs.category }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish file to Discussions
        run: |
          set -euo pipefail

          # 文件必须存在，否则早失败（避免发一条空讨论）
          test -f "$DOC_FILE" || { echo "::error::找不到正文文件 $DOC_FILE"; exit 1; }

          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          repo_id=$(gh api "repos/$GITHUB_REPOSITORY" --jq .node_id)

          category_id=$(gh api graphql \
            -f query='query($o:String!,$r:String!){repository(owner:$o,name:$r){discussionCategories(first:50){nodes{id name}}}}' \
            -f o="$owner" -f r="$repo" \
            --jq ".data.repository.discussionCategories.nodes[] | select(.name==\"$DOC_CATEGORY\") | .id")

          if [ -z "$category_id" ]; then
            echo "::error::分类 $DOC_CATEGORY 不存在"
            exit 1
          fi

          existing=$(gh api graphql \
            -f query='query($o:String!,$r:String!){repository(owner:$o,name:$r){discussions(first:100){nodes{id title}}}}' \
            -f o="$owner" -f r="$repo" \
            --jq ".data.repository.discussions.nodes[] | select(.title==\"$DOC_TITLE\") | .id" | head -n1)

          body=$(cat "$DOC_FILE")

          if [ -n "$existing" ]; then
            echo "同名讨论已存在，追加评论"
            gh api graphql \
              -f query='mutation($id:ID!,$body:String!){addDiscussionComment(input:{discussionId:$id,body:$body}){comment{url}}}' \
              -f id="$existing" -f body="$body"
          else
            echo "创建新讨论"
            gh api graphql \
              -f query='mutation($repo:ID!,$cat:ID!,$title:String!,$body:String!){createDiscussion(input:{repositoryId:$repo,categoryId:$cat,title:$title,body:$body}){discussion{url}}}' \
              -f repo="$repo_id" -f cat="$category_id" -f title="$DOC_TITLE" -f body="$body"
          fi
