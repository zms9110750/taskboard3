name: bot-issue-write

on:
  workflow_dispatch:
    inputs:
      issue:
        description: '目标 issue 编号'
        required: true
        default: '4'

permissions:
  contents: read
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ inputs.issue }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 删除该 issue 旧的 bot 评论（幂等，可重复发布）
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
            --jq '.[] | select(.user.login=="github-actions[bot]") | .id' \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id" || true
              done

      - name: 以 github-actions[bot] 发评论
        run: |
          set -euo pipefail
          jq -Rs '{body: .}' <<< "$BODY" \
            | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --input -
        env:
          BODY: ${{ inputs.body }}
