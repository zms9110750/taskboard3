name: ci

on:
  workflow_dispatch:

# 用户 2026-11-27：测试在 GitHub 上跑、不本地跑；但不随 push/PR 自动跑，
# 改完由人（或 agent）手动 workflow_dispatch。

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check dev tsconfig
        run: pnpm run check:dev

      - name: Check test types
        run: pnpm run check:test-types

      - name: Test
        run: pnpm run test
