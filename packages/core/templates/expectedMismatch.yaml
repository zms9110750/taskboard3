schema: template@1
name: expectedMismatch
displayName: 预期不符
kind: goal
domain: 代码
codePrefix: E

usage: |
  用户认为某处不对 —— 报错、行为异常、跟预期不符 —— 但还没确认是不是缺陷。
  本卡用来查清「哪里不对、为什么这么想、实际发生什么」，并据此定性。
  定性不等于动手修；修不修由用户定。

description: |
  先定性，再定下一步。判断不了就开调研，不下结论。

  定性要落到可指认的位置：哪个功能、哪段行为、哪个文件或接口。写猜测不算定性。

  定性之后按性质分开处理：
  - 确实是缺陷：开编写代码去修。
  - 非目标（本项目不做这件事）：留档，回复用户说明。
  - 用户理解错了：回复解释，必要时补一张记录卡存档。
  - 语义如此（设计本来就是这样）：回复解释，不改代码。
  - 属于二期项目：留档，不排期。
  - 多个性质并存：拆成并列子任务，各自处理。

  定位需要什么信息看场景：
  - 公开仓库、可复现的软件：版本、运行环境、是否已有同类 issue、最小复现。
  - 没有环境可言（作业、一次性脚本、只在某台机器上跑的东西）：不要求版本与环境，
    给最小复现，或直接指出位置。

  只要求定位，或只要一份能提交的报告：不开编写代码。交付就是报告正文 ——
  现象、复现、位置、建议改哪里。本卡到此收敛。

  定性为缺陷且决定修：开编写代码，并列开校验（在编写代码之后），确认修好且没带出新问题。

  解释完用户不接受：转阻碍或提问，不要二次解释同一件事。

  预期依据越硬（文档、同类产品、历史行为），越该按缺陷处理；
  越软（望文生义），越可能是我自己读错了。

derive:
  - label: 调研
    description: 定位、定性
    template: research
  - label: 编写代码
    description: 定性为缺陷，要修
    template: writeCode
  - label: 校验
    description: 修完确认没带坏
    template: verify
  - label: 留档
    description: 非目标 / 二期 / 解释后不改
    template: archive

sections:
  summary:
    label: 一句话描述
    hint: |
      这里用可填写的文本框，一行即可。写现象本身，不写结论、不写猜测。
    default:
      $type: text
      placeholder: 一句话说清哪里不对

  expect:
    label: 希望发生什么
    hint: |
      这里用可填写的文本框，可多行。写用户认为应该发生什么；按他的原话和场景写，
      不要求他论证对错。
    default:
      $type: text
      placeholder: 你预期会怎样

  expectSource:
    label: 为什么这么想
    hint: |
      这里用选项组件，单选，列出几种常见的预期来源。选项从软到硬：望文生义最软，文档或官方表态最硬。
      选出来是为了决定后面怎么处理，不是为了归责。选项只是备选，用户可跳过或自定义。
    default:
      $type: ask
      items:
        - question: 这个预期的依据
          multi_select: false
          options:
            - label: 望文生义
              description: 从语义说，这个东西在这里长这样就应该这样做才有道理
            - label: 同类产品
              description: 具有类似功能的项目实现，具有这样的行为
            - label: 附随文档
              description: 这个项目自己表示会这样说，包括更新说明和readme
            - label: 社区传阅
              description: 有wiki，或视频平台，论坛，有记录的表明很多人这样认为
            - label: 历史惯性
              description: 曾经是这样的行为，更新没说会变，但变了
            - label: 官方暗示
              description: 开发者访谈，笔记，博客。或是维护者在社区宣称，支持，某个功能在现版本发布

  actual:
    label: 实际发生什么
    hint: |
      这里用可填写的文本框，可多行。只写事实：实际看到了什么、报了什么错。
      不写解释，不写成因猜测 —— 那些留给补充说明。
    default:
      $type: text
      placeholder: 实际看到什么

  locate:
    label: 怎么定位
    hint: |
      这里用可填写的文本框。引导填写以下三者之一：出现频率、最小复现、问题仓库。
      三者都拿不到时，写清为什么拿不到 —— 这本身就是定位结论的一部分。
    default:
      $type: text
      placeholder: 出现频率 / 最小复现 / 问题仓库

  note:
    label: 补充说明
    hint: |
      这里用可填写的文本框。写猜测的成因；没有猜测就写没有。
      猜测放在这一章，是为了让它不污染事实与预期。
    default:
      $type: text
      placeholder: 猜测的成因
