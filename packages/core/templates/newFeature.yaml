schema: template@1
name: newFeature
displayName: 新增功能
kind: goal
domain: 代码
codePrefix: F

usage: |
  用户要一个现在没有的东西，目标能说清，但怎么做要先拆开分别定。
  已经存在、只是不满意它的表现，不要用本卡：行为不对用预期不符，行为不变只改内部用项目优化。

description: |
  本卡是目标卡，自己不写代码、不记结果：要做的事都在子任务里，卡上只留下拆法与约束。

  卡上只写「要什么」，不写「怎么做」。用户顺口提到的做法不是需求 ——
  它可以作为候选项交给决策卡，不要直接当成目标。

  用户一定有没有说全的地方。能推断就推断；推断不出来就开提问卡，不要用猜测去填章节。

  补全的形状是「用户说 A，那么必然还有 B、C」：
  - 用户说要存，就必须考虑存了一定要能删。
  - 用户说要改键位，就必须考虑入口（从哪改）与通知机制（改完怎么让人知道生效了），以及映射本身。
  - 用户说要发东西到外面，就必须考虑安全性与隐私：什么不该发、什么会外泄、传输过程中是否会被劫持。
  - 用户说要接受并执行外部输入，就必须考虑安全性与沙盒：越权、注入、执行边界。
  - 用户说要依赖外部服务，就必须考虑对方不可用、超时、重试之后的数据状态。
  - 用户说要并发，就必须考虑顺序、冲突、重复提交。
  - 用户说项目里已有旧数据或旧接口，就必须考虑兼容与迁移。

  以上只是例子，不是穷举。按这张卡实际涉及的情形判断该写哪些；没涉及的不写，
  没列到的按实际情况考虑。

  写出来的每一条，由用户决定做还是不做：做的进子任务，不做的移到非目标。

  设计确认后才开实现。实现可以按能独立完成的块拆开做，不必等所有设计都定完。
  实现完开交付，并列开校验。

derive:
  - label: 调研
    description: 不清楚现状、值不值得、怎么实现
    template: research
  - label: 演示
    description: 先看效果再定方向
    template: demo
  - label: 决策
    description: 几条路都成立，先摆岔口
    template: decision
  - label: 接口界面
    description: 定对外形状
    template: interfaceUi
  - label: 技术架构
    description: 定内部结构
    template: architecture
  - label: 编写代码
    description: 开工作卡去实现
    template: writeCode
  - label: 校验
    description: 实现完确认没带坏
    template: verify

sections:
  behavior:
    label: 需要有什么行为
    hint: |
      这里用可填写的文本框。写使用者要能做成什么：一条一行，按他的动作和结果写。
      写目标，不写做法：具体名字与参数是接口界面的事，不要在这里定。
    default:
      $type: text
      placeholder: 这东西要能做什么

  motivation:
    label: 动机
    hint: |
      这里用可填写的文本框。写现在缺了它会怎样、谁在什么场景下会用。
      写能对照的事实，不写愿望。
    default:
      $type: text
      placeholder: 为什么需要它

  concerns:
    label: 应当考虑的问题
    hint: |
      这里用可填写的文本框。这一章是 ai 对用户说法的语义补全，不是风险清单：
      用户说 A，就写出「既然有 A，就必然还涉及 B、C」。
      例如用户说要存，要补出「存了一定要能删」；说要改键位，要补出入口与通知机制。
      一条一行，写清这是从哪句需求推出来的；由用户决定做还是不做，不做就移到非目标。
    default:
      $type: text
      placeholder: 从你要的东西里，必然还涉及什么

  nonGoal:
    label: 非目标
    hint: |
      这里用可填写的文本框。写这次明确不做什么，以及为什么不做。
      不写这一章，以后会被当成遗漏，或被无限追加。
    default:
      $type: text
      placeholder: 这次明确不做什么
