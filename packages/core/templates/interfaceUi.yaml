schema: template@1
name: interfaceUi
displayName: 接口界面
kind: design
domain: 代码
codePrefix: I

usage: |
  决定对外暴露几个入口、每个入口长什么样 —— 使用者不读文档也不知道底层，只靠看到的东西能不能猜对。
  不是「使用者会怎么用」的问题，别用本卡。

description: |
  本卡是设计卡：产出的是取舍，要先定数量、形状。

  数量本身是设计决定：
  - 多拆一个接口或一颗按钮，使用者要选的就多一层；写进 AI 工具的提示词时，
    多一个工具就多一段说明，累积起来不可接受。
  - 反过来，把很多能力压进同一个入口、靠参数区分，密度太高，望文生义就失效 ——
    使用者看不出它还会做什么，也用不对。

  所以先定暴露几个，再定每个的形状，最后才写清条件对应关系。三章合起来才是设计。

  不确定的部分写进「还没决定」并写明理由；以后另开新卡，不要回头改这张卡。

  几种拆法都说得通、拿不准：先开决策。
  同类产品怎么拆、惯例是什么不清楚：先开调研。
  要看到形状才判断得了：开演示，给能看的最小样本，产物不进项目。

  接口定了再开底层实现；底层定了才开编写代码。

  方向由用户确认，ai 不拍板。

derive:
  - label: 决策
    description: 拆成几个入口、哪种形状，先摆岔口
    template: decision
  - label: 调研
    description: 命名与交互惯例、同类产品怎么拆
    template: research
  - label: 演示
    description: 先给能看的最小样本
    template: demo
  - label: 底层实现
    description: 接口定了，接着定内部怎么搭
    template: lowLevel
  - label: 编写代码
    description: 接口与内部都定了，开工作卡去实现
    template: writeCode

sections:
  behavior:
    label: 需要有什么行为
    hint: |
      这里用可填写的文本框。写本次设计要考虑的行为的全集：一条一行，先列出来看。
      这是候选池，不是承诺 —— 最终暴露出去的是哪几条，由下面两章定。
    default:
      $type: text
      placeholder: 本次设计要考虑哪些行为

  exposed:
    label: 暴露什么东西
    hint: |
      这里用可填写的文本框。先答数量：几个 API、几颗按钮、几个键位。
      再逐个列：各自的名称、参数、返回值、错误形式；交互类写位置、可见状态。
      并写清为什么是这个数量 —— 为什么不合并、为什么不拆开。
    default:
      $type: text
      placeholder: 几个 API / 几颗按钮，各自是什么

  mapping:
    label: 接口和行为的条件映射
    hint: |
      这里用可填写的文本框。写条件 → 行为：同一个入口在什么前提下表现为哪一条行为。
      例子：选中的是已归档的，这颗按钮点下去是取消归档；没归档，点下去是归档。
      同为一条路径，带筛选参数走筛选，不带走全部；路径是文件按文件处理。
      两条规则同时命中时以哪条为准，也写在这里。
    default:
      $type: text
      placeholder: 哪个接口 → 什么条件 → 返回什么

  undecided:
    label: 还没决定的行为和接口
    hint: |
      这里用可填写的文本框。写这次明确不定、留到以后的部分，以及为什么现在不定。
      写清这一条，实现时才不会自行决定；以后要另开新卡，不要回头改这张卡。
    default:
      $type: text
      placeholder: 这次不定、留到以后的部分
