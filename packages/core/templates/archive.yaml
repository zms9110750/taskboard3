schema: template@1
name: archive
displayName: 留档
kind: record
domain: 核心
codePrefix: A

usage: |
  有东西要留着，记下来。并且不需要用户介入的事情。
  例如执行工作时踩坑了，或者描述用户的风格。

description: |
  本卡的语义是不需要用户交互，但不意味着 ai 的判断对了。
  用户总是可以追认和否认。不应该预设没有冗余的留档是确有其事。

  后续创建新任务时，如果留档与之相关（例如有未解决的问题、用户的风格偏好），
  把本卡列为参考或约束。

sections:
  what:
    label: 留档内容
    hint: |
      这里按内容性质选组件：客观问题（例如环境状态）用提交后不可交互的展示组件；
      主观问题（例如用户风格）用可填写的文本框。
      组件初始内容放要保留的资料本身。
    default:
      $type: markdown
      placeholder: 把要保留的资料放在这里

  why:
    label: 留档适用性
    hint: |
      这里用提交后不可交互的展示组件。写以后什么情况下会用到它，
      或描述这份留档的性质与范围。
    default:
      $type: markdown
      placeholder: 以后什么情况下会用到它；这份留档描述的性质 / 范围
