schema: template@1
name: lowLevel
displayName: 底层实现
kind: design
domain: 代码
codePrefix: M

usage: |
  把接口界面的承诺补到能兑现：内部怎么拆、用哪个已拉的库、边缘情况与报错形式。
  接口界面没写完的，全在这里补完。

description: |
  本卡是设计卡。每张接口界面至少要接一张本卡，这是下限，不是一一对应。

  按相关性聚合，不按接口数量拆：同族操作（例如设计里要有「增加」，就还有 `Add` / `Insert`）、
  共享同一套边界处理、从同一组库里选用的，放一张卡里一次定完 —— 它们有高度重复的逻辑。
  完全不相干的接口不要拼进同一张卡，边界和报错会混在一起，看不出哪条属于哪个入口。

  本卡的「用什么」，是在已经拉的库里选，不是重新决定拉什么库：
  技术架构决定生态与来源，这里决定该生态下具体用哪一个。
  例如架构已选定观察者生态，这里才需要决定具体用哪一个；
  架构已引入消息机制，这里才需要决定是现成实现还是自己写。
  它们可以混用，也可能和语言自带的机制竞争 —— 例如进度通知、观察者、event 三者几乎一样，
  这时才需要定用哪个。没有这类竞争时，不引入选择，直接用已定的那个。

  接口界面不会把所有情况都写完。没覆盖到的情形在这里补：各自怎么办、报什么错。
  例如涉及文件或路径时：没有读权限、文件过大读不完、路径非法、路径下没有东西。
  例如涉及外部输入时：格式不对、超出范围、空值、重复。
  例如涉及网络或外部服务时：超时、中断、返回异常。
  例如涉及并发时：同时改同一样东西、重复提交。
  这些只是例子，按这张卡实际涉及的东西判断该写哪些，没涉及的不要硬写。

  补不完、判断不了：先开调研。内部有几种搭法都成立：先开决策。
  要看到实际效果才判断得了：开演示，产物不进项目。

  本卡确认后开编写代码；确认前不开实现。

  方向由用户确认，ai 不拍板。

derive:
  - label: 调研
    description: 某个库 / 平台行为查不清、边界拿不准
    template: research
  - label: 决策
    description: 内部有几种搭法都成立，先摆岔口
    template: decision
  - label: 演示
    description: 要看实际效果才判断得了
    template: demo
  - label: 编写代码
    description: 结构定了，开工作卡去实现
    template: writeCode

sections:
  interface:
    label: 接口，参数
    hint: |
      这里用可填写的文本框。写这张卡覆盖了哪几个对外接口 —— 可以多个，并写清为什么归在一张卡；
      写每个的内部签名与参数含义、内部模块怎么拆、谁调谁。
      对外名字不在这里重新定 —— 那是接口界面定过的。
    default:
      $type: text
      placeholder: 内部接口与参数

  deps:
    label: 用什么
    hint: |
      这里用可填写的文本框。只在存在取舍时才写：同一需求有几个现成实现可用、
      或与语言自带机制竞争的场合，写选哪个、为什么是它而不是另一个。
      没有取舍就直接写「用已定的 X，无替代」，不要为了凑内容编造候选。
      库可以混用，写清在哪一处混用、为什么。
      只写从已拉取 / 已引入的库里怎么选，不写要不要新拉一个库 —— 那是技术架构的事。
    default:
      $type: text
      placeholder: 用什么库 / 服务 / 现成实现

  edgeCases:
    label: 边缘情况边界
    hint: |
      这里用可填写的文本框。按条件写：接口界面没覆盖到的情形，各自怎么处理、对外报什么错。

      - 涉及文件或路径时：没有权限、文件过大读不完、路径非法、路径下没有东西。
      - 涉及外部输入时：格式错误、超出范围、空值、重复。
      - 涉及网络或外部服务时：超时、中断、返回异常。
      - 涉及并发时：同时改同一样东西、重复提交。

      以上只是例子，按这张卡实际涉及的东西判断该写哪些；没涉及的不要硬写。
      一条写清「什么情况 → 怎么处理」，以及报什么错、以什么形式报。
      区分可恢复与不可恢复：可恢复的说清怎么恢复或重试。
    default:
      $type: text
      placeholder: 边界情况与各自的处理
