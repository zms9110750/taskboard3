# 任务板 —— **一个 bundle，若干插件条目**（行数以下方 insert 为准，别在注释里写数字）。
#
# 设置页看到的是一张「任务板」卡片，点进去能看到全部组件，各自独立开关。
#
# ## 这个结构是用户 `2026-11-23` 要的
#
# > 「为什么这里有3个包？任务板1是只有一个入口，然后入口里面有各自的包。」
# > 「怎么接入dsh的那几个包没了？ui也是一个包也可以关掉的啊。」
#
# ## 行各自负责什么
#
# | 行 | 包 | 关掉它会怎样 |
# |---|---|---|
# | 存储 | `@taskboard/store` | 任务板整个不激活（其余行都依赖它） |
# | 核心实例 | `@taskboard/dsh-core` | 其余行全不激活（它们 inject `taskboard3Core`） |
# | Host HTTP + 命令 | `@taskboard/dsh` | 界面拉不到数据、斜杠命令没了；**AI 工具还在** |
# | AI 工具 | `@taskboard/dsh-tools` | 数据和界面都还在，**agent 用不了任务板** |
# | 浏览器 UI（通用） | `@taskboard/dsh-client` | 任务板界面消失；**权限 UI 不受影响** |
# | agent 守卫 | `@taskboard/dsh-agent-guard` | 三档位消失、guard 不挂、/api/tools 404；**权限 UI（下一行）也跟着不激活** |
# | 权限 UI | `@taskboard/dsh-permissions` | 工具权限页 / composer 权限框 / 模板授权消失；任务板其它功能不受影响 |
#
# ## ⑦ 权限 UI 行的激活闸门（2026-11-27，#4 分包裁定）
#
# `@taskboard/dsh-permissions` 的 Host 半声明 `inject: ['taskboard3AgentGuard']`。
# ⇒ 守卫行（⑥）不在时⑦**整行不激活**（不是降级、不是报错）——
# 这就是「只有权限守卫出来了才工作」。⚠ 用户会看到权限入口无声消失，
# 这是设计意图；patch 注释在此留痕。
#
# ## 为什么 ② 和 ③ 要分成两行
#
# `Taskboard` 是**内存状态**（卡缓存 / 权限档位 / 模板注册表）。
# 如果 HTTP 和工具各自 `createTaskboard()`，就会有 2 份互不可见的状态 ——
# 工具改了卡，HTTP 读不到。**这是拆分最容易踩的坑。**
#
# ⇒ ② 建一份实例并 `provide('taskboard3Core', …)`，③④ `inject` 它。
#
# ## ⚠ 子包各自的 `cordis.patch.yml` 都保留着
#
# 它们不再被 profile 装配（本文件统一承载），但单测/预览/将来拆回独立 bundle 都用得上。

- insert:
    # ① 持久化：内存内容 → 磁盘
    #
    #    **唯一可替换点**。关掉这一行、装一个同样 `provide('taskboard3Store', …)`
    #    的包，上层零改动就能换存储实现（用户原话：「可能使用者想要不同的实现，
    #    关闭部分插件并替换他的实现」）。
    - id: taskboard3-store
      name: '@taskboard/store'

    # ② 核心实例：全仓唯一 `createTaskboard()` 的地方
    #
    #    提供两个服务：
    #      · `taskboard3Core`              ← ③④ inject 它
    #      · `taskboard3DefaultWorkspaceId` ← 入口默认空间策略
    #      · `taskboard3Bus`               ← ⚠ 原型期脚手架，SSE 用
    #
    # TODO(审查): taskboard3Bus 属于 AGENTS §五 要拆的临时脚手架（core/src/bus.ts + dsh/src/sse.ts）；
    #   拆的时候必须回来改本 patch（删这行/换 provide），否则 patch 会继续引用已删服务。注释提示，无行为影响。
    - id: taskboard3-core
      name: '@taskboard/dsh-core'

    # ③ Host 半边：HTTP 路由 + 斜杠命令
    #
    #    给**人**用的通道：14 条 HTTP 端点（浏览器 UI 读写）+ 3 个斜杠命令。
    #    关掉它 ⇒ 数据和 AI 工具都在，但界面拉不到东西、命令没了。
    #
    # TODO(审查): 「14 条 HTTP 端点」「11 个 taskboard_*」（④ 行）都是易漂数字 —— AGENTS 记录过 9 条用户
    #   定义工具；本次未复核。建议改成不写数字，或由测试对真实注册数做守护。
    - id: taskboard3-host
      name: '@taskboard/dsh'

    # ④ AI 工具面：11 个 taskboard_* + 权限 guard
    #
    #    给**模型**用的通道。定义在 `@taskboard/tools`（纯库，MCP 也吃同一份），
    #    本行只做 DSH 侧的 schema 适配 + 注册。
    #    关掉它 ⇒ 数据和界面都在，agent 调不到任务板。
    #
    # TODO(审查): ④ 标题里的「11 个 taskboard_*」与 AGENTS 的「9 条用户定义」不一致（可能有 2 个权限工具），
    #   未复核。另：本行「+ 权限 guard」与 ⑥ 的 guard 归属重复，确认后删其中一处描述。
    - id: taskboard3-tools
      name: '@taskboard/dsh-tools'

    # ⑤ 浏览器界面：左侧栏 / 抽屉 / 右侧工作区 三个入口
    #
    #    关掉它 ⇒ 数据还在、AI 还能用，只是人看不到。
    - id: taskboard3-client
      name: '@taskboard/dsh-client'

    # ⑥ agent 侧权限面：三个 tool 档位 + 入侵式 guard + 两个权限 AI 工具 + GET /api/tools
    #
    #    **DSH 私人专属**（用户 2026-11-23：「这是对于dsh私人的专属功能」「mcp不提供这个工具和ui」）。
    #    关掉它 ⇒ 三档位消失、guard 不挂、两个 policy 工具没了、/api/tools 404；
    #    任务板其它功能不受影响。**下一行（权限 UI）会跟着整行不激活。**
    - id: taskboard3-agent-guard
      name: '@taskboard/dsh-agent-guard'

    # ⑦ 权限 UI：工具权限页 / 模板授权 / 组图 / composer 权限框（由 dsh-client 拆出）
    #
    #    激活闸门 = Host 半 `inject: ['taskboard3AgentGuard']`（见文件头说明）。
    #    关掉它 ⇒ 权限入口消失；任务板其它功能不受影响。
    - id: taskboard3-permissions
      name: '@taskboard/dsh-permissions'
