<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="840" viewBox="0 0 1180 840" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1178" height="838" rx="18" fill="#ffffff" stroke="#d0d7de"/>

  <text x="40" y="50" font-size="22" font-weight="700" fill="#1f2328">46-A · 折叠体系 · 组件拆分提案</text>
  <text x="40" y="76" font-size="13" fill="#59636e">对应 #47 宽度 / #48 收起无底色 / #49 展开不偏移 / #50 角标位置 / #51 折叠无底色 / #52 独立组件</text>

  <!-- ══════════ 左：组件树 ══════════ -->
  <text x="44" y="112" font-size="14" font-weight="700" fill="#1f2328">① 组件树（紫色虚线 = 新增组件）</text>

  <!-- FoldGroup -->
  <rect x="44" y="126" width="544" height="56" rx="10" fill="#fbf7ff" stroke="#8250df" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="60" y="150" font-size="14" font-weight="700" font-family="Consolas, monospace" fill="#8250df">FoldGroup</text>
  <text x="60" y="170" font-size="12" fill="#59636e">容器：持有 open / tone / children —— 它决定「有没有底色和框」</text>

  <!-- 竖线 -->
  <path d="M 70 182 L 70 592" stroke="#afb8c1" stroke-width="1.4" fill="none"/>

  <!-- FoldBanner -->
  <rect x="92" y="196" width="496" height="56" rx="10" fill="#fbf7ff" stroke="#8250df" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M 70 224 L 92 224" stroke="#afb8c1" stroke-width="1.4" fill="none"/>
  <text x="108" y="220" font-size="14" font-weight="700" font-family="Consolas, monospace" fill="#8250df">FoldBanner</text>
  <text x="108" y="240" font-size="12" fill="#59636e">横幅行：标题 + 计数 + 折叠符；整行可点，点击切换 open</text>

  <!-- FoldChevron -->
  <rect x="140" y="266" width="448" height="50" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.3"/>
  <path d="M 118 252 L 118 291 L 140 291" stroke="#afb8c1" stroke-width="1.4" fill="none"/>
  <text x="156" y="288" font-size="13" font-weight="600" font-family="Consolas, monospace" fill="#1f2328">FoldChevron</text>
  <text x="156" y="306" font-size="12" fill="#59636e">▸ / ▾ 折叠指示（内联，不单独成件）</text>

  <!-- CountBadge -->
  <rect x="140" y="330" width="448" height="50" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.3"/>
  <path d="M 118 316 L 118 355 L 140 355" stroke="#afb8c1" stroke-width="1.4" fill="none"/>
  <text x="156" y="352" font-size="13" font-weight="600" font-family="Consolas, monospace" fill="#1f2328">CountBadge</text>
  <text x="156" y="370" font-size="12" fill="#59636e">「5 张」—— 只吃 number，不吃业务语义</text>

  <!-- FoldBody -->
  <rect x="92" y="396" width="496" height="56" rx="10" fill="#fbf7ff" stroke="#8250df" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M 70 424 L 92 424" stroke="#afb8c1" stroke-width="1.4" fill="none"/>
  <text x="108" y="420" font-size="14" font-weight="700" font-family="Consolas, monospace" fill="#8250df">FoldBody</text>
  <text x="108" y="440" font-size="12" fill="#59636e">展开区：仅 open 时渲染；负责底色 + 外框 + 左缩进</text>

  <!-- CardFrame -->
  <rect x="92" y="466" width="496" height="56" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
  <path d="M 70 494 L 92 494" stroke="#afb8c1" stroke-width="1.4" fill="none"/>
  <text x="108" y="490" font-size="14" font-weight="700" font-family="Consolas, monospace" fill="#1f2328">CardFrame</text>
  <text x="108" y="510" font-size="12" fill="#59636e">卡片外壳（现有，抽出）：内容槽 + 一个右下角标槽</text>

  <!-- BadgeButton -->
  <rect x="140" y="536" width="448" height="56" rx="10" fill="#fbf7ff" stroke="#8250df" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M 118 522 L 118 564 L 140 564" stroke="#afb8c1" stroke-width="1.4" fill="none"/>
  <text x="156" y="560" font-size="13" font-weight="700" font-family="Consolas, monospace" fill="#8250df">BadgeButton</text>
  <text x="156" y="580" font-size="12" fill="#59636e">角标按钮（3 / −）：由 CardFrame 定位，自带固定内距，绝不骑边框</text>

  <text x="44" y="628" font-size="12" fill="#59636e">调用关系：CardFrame 只负责「把角标放在哪」，BadgeButton 只负责「长什么样」。</text>
  <text x="44" y="650" font-size="12" fill="#59636e">两者都不认识「任务 / 子卡 / 组」这些业务词 —— 业务判断留在页面层。</text>

  <!-- ══════════ 右：两态 ══════════ -->
  <text x="644" y="112" font-size="14" font-weight="700" fill="#1f2328">② 两态：底色只属于「展开」</text>

  <!-- 折叠态 -->
  <rect x="644" y="126" width="496" height="112" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="660" y="148" font-size="12" font-weight="700" fill="#1f2328">折叠态（open = false）</text>
  <text x="660" y="166" font-size="11" fill="#59636e">FoldGroup 不上底色、不上外框；只有一行横幅</text>

  <text x="676" y="200" font-size="14" fill="#6e40c9">▸</text>
  <text x="696" y="200" font-size="14" font-weight="600" fill="#1f2328">根卡组</text>
  <line x1="762" y1="195" x2="1040" y2="195" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1054" y="200" font-size="13" fill="#59636e">5 张</text>
  <text x="676" y="222" font-size="11" fill="#bf8700">✗ 无华而不实的填充</text>

  <!-- 展开态 -->
  <rect x="644" y="252" width="496" height="238" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="660" y="274" font-size="12" font-weight="700" fill="#1f2328">展开态（open = true）</text>
  <text x="660" y="292" font-size="11" fill="#59636e">FoldBody 才有底色 + 外框；横幅位置不动，只向下推挤</text>

  <rect x="660" y="304" width="464" height="170" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="680" y="332" font-size="14" fill="#6e40c9">▾</text>
  <text x="700" y="332" font-size="14" font-weight="600" fill="#1f2328">组 3</text>
  <line x1="750" y1="327" x2="1076" y2="327" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1088" y="332" font-size="13" fill="#59636e">6 张</text>

  <rect x="680" y="348" width="424" height="48" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="696" y="368" font-size="11" fill="#6e40c9">GE14</text>
  <text x="736" y="368" font-size="11" fill="#59636e">● 未指定</text>
  <text x="696" y="386" font-size="12" font-weight="600" fill="#1f2328">用户任务 14</text>

  <rect x="680" y="406" width="424" height="48" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="696" y="426" font-size="11" fill="#6e40c9">GE15</text>
  <text x="736" y="426" font-size="11" fill="#59636e">● 未指定</text>
  <text x="696" y="444" font-size="12" font-weight="600" fill="#1f2328">用户任务 15</text>

  <text x="660" y="492" font-size="11" fill="#1a7f37">✓ 横向盒模型与折叠态完全一致（宽度 / 左边缘 / 内边距都不变）</text>

  <!-- tone -->
  <text x="644" y="530" font-size="14" font-weight="700" fill="#1f2328">③ 同一套组件，三种 tone（对应 #52 的两处语境）</text>

  <rect x="644" y="546" width="152" height="72" rx="10" fill="#ffffff" stroke="#d4a72c" stroke-width="1.6"/>
  <text x="660" y="570" font-size="12" font-weight="700" fill="#7d4e00">tone = 候选</text>
  <text x="660" y="590" font-size="11" fill="#59636e">可选 / 待定对象</text>
  <text x="660" y="606" font-size="11" fill="#59636e">accent 金黄</text>

  <rect x="812" y="546" width="152" height="72" rx="10" fill="#f0f6ff" stroke="#1f6feb" stroke-width="1.6"/>
  <text x="828" y="570" font-size="12" font-weight="700" fill="#0a3069">tone = 选取</text>
  <text x="828" y="590" font-size="11" fill="#59636e">已选中 / 已归属</text>
  <text x="828" y="606" font-size="11" fill="#59636e">accent 蓝</text>

  <rect x="980" y="546" width="160" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
  <text x="996" y="570" font-size="12" font-weight="700" fill="#1f2328">tone = 普通</text>
  <text x="996" y="590" font-size="11" fill="#59636e">列表分组 / 授权页</text>
  <text x="996" y="606" font-size="11" fill="#59636e">accent 灰</text>

  <text x="644" y="640" font-size="12" fill="#59636e">同一组件，只换 tone；不允许为「候选」和「选取」各写一套折叠。</text>

  <!-- 底线 -->
  <rect x="644" y="664" width="496" height="112" rx="12" fill="#fff8f0" stroke="#d4a72c"/>
  <text x="660" y="688" font-size="12" font-weight="700" fill="#7d4e00">④ 展开不能改变横幅自身位置（#49）</text>
  <text x="660" y="710" font-size="11" fill="#59636e">• 横幅在文档流里：禁止 position:absolute / 负 margin / transform</text>
  <text x="660" y="730" font-size="11" fill="#59636e">• 展开只改变 FollowBody 的高度 ⇒ 后续内容整体下移</text>
  <text x="660" y="750" font-size="11" fill="#59636e">• 角标由 CardFrame 用 inset 定位：bottom/right 固定内距，不叠边框</text>

  <text x="44" y="700" font-size="12" font-weight="700" fill="#1f2328">本图请求确认的点：</text>
  <text x="44" y="722" font-size="12" fill="#59636e">1. 折叠态是否「完全无底色、无外框」（我只留一行文本 + ▸）？</text>
  <text x="44" y="742" font-size="12" fill="#59636e">2. 角标是放在卡片内部右下（留内距），还是挂在卡片外侧？</text>
  <text x="44" y="762" font-size="12" fill="#59636e">3. tone 三种是否够用，还需要别的语境吗？</text>
  <text x="44" y="792" font-size="11" fill="#8250df">※ 未确认前不动代码；确认后每项单独开分支，分支内测试通过才合 main。</text>
</svg>
