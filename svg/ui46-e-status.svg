<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect x="1" y="1" width="1178" height="718" rx="18" fill="#ffffff" stroke="#d0d7de"/>

  <text x="40" y="50" font-size="22" font-weight="700" fill="#1f2328">46-E · 卡头状态按钮 · 组件拆分提案</text>
  <text x="40" y="76" font-size="13" fill="#59636e">对应 #62 没有边框、看不出可点 / #63 需做成独立组件并在多处复用</text>

  <!-- 现状 vs 目标 -->
  <text x="40" y="112" font-size="14" font-weight="700" fill="#1f2328">① 现状 vs 目标（截图 12）</text>

  <rect x="40" y="126" width="536" height="132" rx="12" fill="#fff5f5" stroke="#cf222e"/>
  <text x="56" y="150" font-size="12" font-weight="700" fill="#a40e26">现在：状态是纯文本 + 一个圆点</text>
  <text x="72" y="186" font-size="15" fill="#6e40c9">●</text>
  <text x="92" y="186" font-size="14" fill="#1f2328">需要授权</text>
  <text x="166" y="186" font-size="13" fill="#6e40c9">DQ01</text>
  <rect x="206" y="170" width="52" height="22" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="216" y="186" font-size="12" fill="#0a3069">D 设计</text>
  <rect x="266" y="170" width="46" height="22" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="278" y="186" font-size="12" fill="#59636e">核心</text>
  <rect x="320" y="170" width="46" height="22" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="332" y="186" font-size="12" fill="#59636e">提问</text>
  <text x="56" y="216" font-size="11" fill="#a40e26">状态没有任何容器 —— 比同行的普通标签还弱</text>
  <text x="56" y="238" font-size="11" fill="#a40e26">用户无法知道它可以点开改状态</text>

  <rect x="600" y="126" width="540" height="132" rx="12" fill="#f0fff4" stroke="#1a7f37"/>
  <text x="616" y="150" font-size="12" font-weight="700" fill="#0f5323">目标：状态是一个明显的按钮</text>
  <rect x="632" y="168" width="128" height="30" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/>
  <text x="646" y="189" font-size="14" fill="#6e40c9">●</text>
  <text x="664" y="189" font-size="13" font-weight="600" fill="#1f2328">需要授权</text>
  <text x="740" y="189" font-size="10" fill="#59636e">▾</text>
  <text x="780" y="189" font-size="11" fill="#59636e">↑ 边框 + 底色 + 箭头 = 可点</text>

  <rect x="632" y="210" width="128" height="30" rx="8" fill="#f6f8fa" stroke="#1f6feb" stroke-width="1.8"/>
  <text x="646" y="231" font-size="14" fill="#1f6feb">●</text>
  <text x="664" y="231" font-size="13" font-weight="600" fill="#1f2328">需要授权</text>
  <text x="740" y="231" font-size="10" fill="#1f6feb">▾</text>
  <text x="780" y="231" font-size="11" fill="#1f6feb">↑ hover / focus 态</text>

  <!-- 组件树 -->
  <text x="40" y="298" font-size="14" font-weight="700" fill="#1f2328">② 组件树</text>

  <rect x="40" y="312" width="560" height="62" rx="12" fill="#fbf7ff" stroke="#8250df" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="58" y="338" font-size="14" font-weight="700" font-family="Consolas, monospace" fill="#8250df">StatusButton</text>
  <text x="58" y="358" font-size="11" fill="#59636e">唯一入口：圆点 + 文案 + 边框 + 箭头；点击打开 StatusMenu</text>

  <path d="M 70 374 L 70 520" stroke="#afb8c1" stroke-width="1.4" fill="none"/>

  <rect x="90" y="388" width="510" height="46" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.3"/>
  <path d="M 70 411 L 90 411" stroke="#afb8c1" stroke-width="1.4" fill="none"/>
  <text x="106" y="409" font-size="11" font-weight="700" font-family="Consolas, monospace" fill="#1f2328">StatusDot</text>
  <text x="106" y="426" font-size="11" fill="#59636e">只吃状态值 → 颜色（9 状态 9 档色，已有）</text>

  <rect x="90" y="444" width="510" height="46" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.3"/>
  <path d="M 70 467 L 90 467" stroke="#afb8c1" stroke-width="1.4" fill="none"/>
  <text x="106" y="465" font-size="11" font-weight="700" font-family="Consolas, monospace" fill="#1f2328">StatusLabel</text>
  <text x="106" y="482" font-size="11" fill="#59636e">文案唯一来源：protocol 的 STATE_LABELS</text>

  <rect x="90" y="500" width="510" height="46" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.3"/>
  <path d="M 70 523 L 90 523" stroke="#afb8c1" stroke-width="1.4" fill="none"/>
  <text x="106" y="521" font-size="11" font-weight="700" font-family="Consolas, monospace" fill="#1f2328">StatusMenu（独立弹层）</text>
  <text x="106" y="538" font-size="11" fill="#59636e">可转移目标列表；不可转移则整条菜单禁用并说明原因</text>

  <!-- props -->
  <text x="640" y="298" font-size="14" font-weight="700" fill="#1f2328">③ Props（三处调用共用）</text>

  <rect x="640" y="312" width="500" height="234" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="656" y="338" font-size="11" font-family="Consolas, monospace" fill="#1f2328">status: TaskState</text>
  <text x="656" y="360" font-size="11" font-family="Consolas, monospace" fill="#1f2328">size?: 'sm' | 'md'</text>
  <text x="656" y="382" font-size="11" font-family="Consolas, monospace" fill="#1f2328">interactive?: boolean</text>
  <text x="656" y="404" font-size="11" font-family="Consolas, monospace" fill="#1f2328">showChevron?: boolean</text>
  <text x="656" y="426" font-size="11" font-family="Consolas, monospace" fill="#1f2328">disabledReason?: string</text>
  <text x="656" y="448" font-size="11" font-family="Consolas, monospace" fill="#1f2328">onOpen?: () =&gt; void</text>
  <text x="656" y="478" font-size="11" fill="#59636e">不接受的输入（刻意）：不接 kind、不接可转移目标列表、</text>
  <text x="656" y="498" font-size="11" fill="#59636e">不自己发请求 —— 这些都归页面层，组件只负责"长什么样 + 点一下"。</text>
  <text x="656" y="526" font-size="11" fill="#bf8700">disabledReason 必填当 interactive=false：避免"点不动却不说为什么"。</text>

  <!-- 三处调用 -->
  <text x="40" y="590" font-size="14" font-weight="700" fill="#1f2328">④ 三处调用点</text>

  <rect x="40" y="604" width="240" height="64" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="628" font-size="12" font-weight="700" font-family="Consolas, monospace" fill="#1f2328">CardRow</text>
  <text x="56" y="648" font-size="11" fill="#59636e">列表行：size=sm，紧凑</text>

  <rect x="296" y="604" width="240" height="64" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="312" y="628" font-size="12" font-weight="700" font-family="Consolas, monospace" fill="#1f2328">DetailHead</text>
  <text x="312" y="648" font-size="11" fill="#59636e">详情头：size=md，带箭头</text>

  <rect x="552" y="604" width="240" height="64" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="568" y="628" font-size="12" font-weight="700" font-family="Consolas, monospace" fill="#1f2328">TechTree node</text>
  <text x="568" y="648" font-size="11" fill="#59636e">树节点：size=sm，冻结时禁用</text>

  <rect x="812" y="604" width="328" height="64" rx="10" fill="#fff8f0" stroke="#d4a72c"/>
  <text x="828" y="628" font-size="11" font-weight="700" fill="#7d4e00">验收</text>
  <text x="828" y="648" font-size="11" fill="#59636e">三处渲染出的边框 / 圆角 / 颜色 / 点击行为来自同一组件</text>

  <text x="40" y="692" font-size="12" fill="#59636e">本图请求确认：状态按钮的强调度 —— 用「紫色描边」（与状态色一致）还是「中性灰描边」？</text>
</svg>
